[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log

[program:php-fpm]
command=/usr/local/sbin/php-fpm
autostart=true
autorestart=true
priority=10

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20

[program:queue-default]
command=php artisan queue:work database --queue=default --sleep=3 --tries=1 --timeout=0 
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/queue-default.log
stderr_logfile=/var/www/html/storage/logs/queue-default-error.log

[program:queue-push-notifications]
command=php artisan queue:work database --queue=push_notifications --sleep=3 --tries=1 --timeout=0 
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/var/www/html/storage/logs/queue-push-notifications.log
stderr_logfile=/var/www/html/storage/logs/queue-push-notifications-error.log

